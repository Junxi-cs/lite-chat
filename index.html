<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简 AI 对话</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2329;
    --muted: #8a9099;
    --primary: #2f6fed;
    --user-bubble: #2f6fed;
    --ai-bubble: #eef1f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .settings {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: grid; grid-template-columns: 80px 1fr; gap: 10px 12px; align-items: center;
  }
  .settings label { font-size: 13px; color: var(--muted); }
  .settings input, .settings select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; background: #fff; color: var(--text);
  }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--ai-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #fdecec; color: #c0392b; border: 1px solid #f5c6c6; }
  .input-bar { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  .input-bar textarea {
    flex: 1; resize: none; height: 44px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .input-bar button {
    padding: 0 20px; border: none; border-radius: 8px; background: var(--primary); color: #fff;
    font-size: 14px; cursor: pointer;
  }
  .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); }
  .model-info { padding: 2px 16px 10px; font-size: 12px; color: var(--muted); background: var(--panel); }
  .model-info b { color: var(--primary); font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>极简 AI 对话</h1>
    <span class="hint" id="status"></span>
  </header>

  <div class="settings">
    <label>对话模式</label>
    <select id="mode">
      <option value="external">外部 API（需 Key）</option>
      <option value="local">本地模型</option>
    </select>

    <label>接口地址</label>
    <input id="base_url" placeholder="本地 http://127.0.0.1:1234 或 外部 https://api.openai.com/v1（可省略 /v1）" />

    <label>API Key</label>
    <input id="api_key" type="password" placeholder="sk-...（本地模型可留空）" />
  </div>

  <div class="model-info">当前模型：<b id="modelInfo">未选择（填好接口地址后自动探测）</b></div>

  <div id="messages"></div>

  <div class="input-bar">
    <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const messagesEl = $('messages');
  let messages = [];   // 当前会话上下文（仅内存，不持久化、不管理历史）
  let busy = false;
  let currentModel = '';  // 自动探测得到的模型名（界面不展示输入框，自动选择）

  // 根据接口地址自动探测可用模型，并默认选第一个对话模型（跳过 embedding）
  // 无需手动点按钮：地址 / Key / 模式变化时都会自动触发
  async function detectModel() {
    const base_url = $('base_url').value.trim();
    const api_key = $('api_key').value.trim();
    if (!base_url) {
      currentModel = '';
      $('modelInfo').textContent = '未选择（填好接口地址后自动探测）';
      return;
    }
    $('status').textContent = '探测模型中…';
    try {
      const res = await fetch('/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base_url, api_key }),
      });
      const data = await res.json();
      if (data.error) {
        currentModel = '';
        $('modelInfo').textContent = '探测失败：' + data.error;
        $('status').textContent = '';
        return;
      }
      const list = data.models || [];
      const chatList = list.filter((id) => id.toLowerCase().indexOf('embed') === -1);
      const pick = chatList[0] || list[0] || '';
      currentModel = pick;
      $('modelInfo').textContent = pick ? ('已自动选择 ' + pick) : '该服务无可用模型';
      $('status').textContent = '';
    } catch (e) {
      currentModel = '';
      $('modelInfo').textContent = '探测失败：' + e.message;
      $('status').textContent = '';
    }
  }
  // 地址 / Key / 模式 变化即自动探测，无需手动点击
  $('base_url').addEventListener('change', detectModel);
  $('api_key').addEventListener('change', detectModel);
  $('mode').addEventListener('change', detectModel);

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function send() {
    if (busy) return;
    const text = $('input').value.trim();
    if (!text) return;

    const base_url = $('base_url').value.trim();
    const api_key = $('api_key').value.trim();
    const model = currentModel;   // 使用自动探测到的模型（后端在为空时也会兜底自动选）
    const mode = $('mode').value;

    if (!base_url) { alert('请填写接口地址'); return; }
    if (mode === 'external' && !api_key) { alert('外部模式需要填写 API Key'); return; }

    // 记录用户消息
    messages.push({ role: 'user', content: text });
    addBubble('user', text);
    $('input').value = '';

    // 创建 AI 气泡，流式追加内容
    const aiBubble = addBubble('ai', '');
    let aiText = '';
    busy = true;
    $('send').disabled = true;
    $('status').textContent = '生成中…';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode, base_url, api_key, model, messages }),
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const obj = JSON.parse(data);
            if (obj.error) {
              aiBubble.className = 'msg error';
              aiBubble.textContent = '出错：' + obj.error;
            } else if (obj.content) {
              aiText += obj.content;
              aiBubble.textContent = aiText;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          } catch (e) { /* 忽略不完整分片 */ }
        }
      }
      if (aiText) messages.push({ role: 'assistant', content: aiText });
      $('status').textContent = '';
    } catch (err) {
      aiBubble.className = 'msg error';
      aiBubble.textContent = '请求失败：' + err.message;
      $('status').textContent = '';
    } finally {
      busy = false;
      $('send').disabled = false;
    }
  }

  $('send').addEventListener('click', send);
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
